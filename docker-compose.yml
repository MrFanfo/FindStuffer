name: findstuff

services:
  findstuff:
    image: ${FINDSTUFF_IMAGE:-ghcr.io/mrfanfo/findstuffer:latest}
    pull_policy: always
    ports:
      - "${FINDSTUFF_BIND_ADDRESS:-127.0.0.1}:${FINDSTUFF_PORT:-8000}:8000"
    environment:
      FINDSTUFF_DATA_DIR: /app/data
      FINDSTUFF_DATABASE_PATH: /app/data/findstuff.sqlite3
      FINDSTUFF_FRONTEND_DIST: /app/frontend/dist
      FINDSTUFF_CONTAINER: "1"
      FINDSTUFF_REQUIRE_AUTH: "${FINDSTUFF_REQUIRE_AUTH:-true}"
      FINDSTUFF_ADMIN_USERNAME: "${FINDSTUFF_ADMIN_USERNAME:-admin}"
      FINDSTUFF_ADMIN_PASSWORD: "${FINDSTUFF_ADMIN_PASSWORD:-}"
      FINDSTUFF_SOFTWARE_UPDATE_ENABLED: "${FINDSTUFF_SOFTWARE_UPDATE_ENABLED:-false}"
      FINDSTUFF_SECURE_COOKIES: "${FINDSTUFF_SECURE_COOKIES:-false}"
      FINDSTUFF_AI_ENDPOINT: "${FINDSTUFF_AI_ENDPOINT:-}"
      FINDSTUFF_AI_API_KEY: "${FINDSTUFF_AI_API_KEY:-}"
      FINDSTUFF_AI_MODEL: "${FINDSTUFF_AI_MODEL:-}"
      FINDSTUFF_STT_ENDPOINT: "${FINDSTUFF_STT_ENDPOINT:-}"
      FINDSTUFF_STT_API_KEY: "${FINDSTUFF_STT_API_KEY:-}"
      FINDSTUFF_STT_MODEL: "${FINDSTUFF_STT_MODEL:-}"
      FINDSTUFF_MQTT_HOST: "${FINDSTUFF_MQTT_HOST:-}"
      FINDSTUFF_MQTT_PORT: "${FINDSTUFF_MQTT_PORT:-1883}"
      FINDSTUFF_MQTT_USERNAME: "${FINDSTUFF_MQTT_USERNAME:-}"
      FINDSTUFF_MQTT_PASSWORD: "${FINDSTUFF_MQTT_PASSWORD:-}"
      FINDSTUFF_MQTT_BASE_TOPIC: "${FINDSTUFF_MQTT_BASE_TOPIC:-findstuff}"
      FINDSTUFF_MQTT_DISCOVERY_PREFIX: "${FINDSTUFF_MQTT_DISCOVERY_PREFIX:-homeassistant}"
      FINDSTUFF_MQTT_CLIENT_ID: "${FINDSTUFF_MQTT_CLIENT_ID:-findstuff}"
      FINDSTUFF_MQTT_PUBLISH_INTERVAL_SECONDS: "${FINDSTUFF_MQTT_PUBLISH_INTERVAL_SECONDS:-60}"
      FINDSTUFF_AUTO_BACKUP_ENABLED: "${FINDSTUFF_AUTO_BACKUP_ENABLED:-true}"
      FINDSTUFF_BACKUP_DIR: "${FINDSTUFF_BACKUP_DIR:-/app/data/backups}"
      FINDSTUFF_BACKUP_KEEP: "${FINDSTUFF_BACKUP_KEEP:-14}"
      FINDSTUFF_BACKUP_CHECK_INTERVAL_SECONDS: "${FINDSTUFF_BACKUP_CHECK_INTERVAL_SECONDS:-3600}"
      FINDSTUFF_EXTERNAL_IMAGE_HOSTS: "${FINDSTUFF_EXTERNAL_IMAGE_HOSTS:-images.openfoodfacts.org}"
      FINDSTUFF_ALLOW_PRIVATE_INTEGRATION_URLS: "${FINDSTUFF_ALLOW_PRIVATE_INTEGRATION_URLS:-false}"
    user: "${FINDSTUFF_UID:-10001}:${FINDSTUFF_GID:-10001}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
