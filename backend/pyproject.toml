[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findstuff"
version = "1.0.1"
description = "Lightweight self-hosted home inventory"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.4,<4.10",
  "fastapi>=0.115,<0.116",
  "httpx>=0.27,<0.29",
  "paho-mqtt>=2.1,<3",
  "python-multipart>=0.0.20,<0.1",
  "segno>=1.6,<2",
  "uvicorn>=0.30,<0.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
findstuff = "findstuff.cli:main"
findstuff-mcp = "findstuff.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["findstuff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
