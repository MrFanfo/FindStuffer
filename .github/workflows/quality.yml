name: Quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python scripts/check-public-repo.py
      - run: shellcheck install.sh install-docker.sh update-docker.sh scripts/test-update-docker.sh scripts/test-docker-restore.sh
      - run: ./scripts/test-update-docker.sh
      - run: docker compose config --quiet
      - run: python -m pip install -e 'backend[dev]'
      - run: ruff check backend
      - run: pytest -q
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
